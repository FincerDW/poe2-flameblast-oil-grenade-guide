 $('stage-panel').innerHTML=`<div class="stage-header"><div><small>${esc(s.subtitle)}</small><h3>${esc(s.name)}</h3><p>${rich(s.summary)}</p></div><div class="stage-symbol" aria-hidden="true">${currentStage<3?'⚒':'✧'}</div></div><div class="stage-notes">${s.notes.map(prose).join('')}</div><div class="stage-artwork"><h4>${label('stageArt')}</h4><p class="fineprint">${label('stageArtNote')}</p><div class="equipment-gallery">${ASSETS.gear[currentStage].map(item=>`<figure class="equipment-figure">${imageId(item.image,'equipment-art',item.tooltip)}<figcaption>${TERMS[item.name]?term(item.name):label('slot_'+item.kind)}${item.set?' · '+label('set'+item.set):''}<small>${esc(item.name)}</small></figcaption></figure>`).join('')}</div></div><div class="skill-heading"><h3>${label('skills')}</h3><div class="attributes"><span>${label('supportAttr')}</span><span>${label('strength')}<b>${s.attributes[0]}</b></span><span>${label('dexterity')}<b>${s.attributes[1]}</b></span><span>${label('intelligence')}<b>${s.attributes[2]}</b></span></div></div><p class="fineprint">${label('supportAttrNote')}</p><table class="skill-table"><thead><tr><th>${label('skillName')}</th><th>${label('supports')}</th></tr></thead><tbody>${s.skills.map(g=>{
 const badge=g.placeholder?label('placeholder'):currentStage>=3?(g.name==='Flameblast'?label('set1'):g.name==='Oil Grenade'?label('set2'):label('tool')):'';
 return `<tr class="${g.placeholder?'placeholder-row':''}"><td><div class="skill-main">${gameImage(g.name,'skill-art')}<div>${term(g.name)}<div class="skill-en">${esc(g.name)}${g.level?' · Lv. '+g.level:''}</div>${badge?`<span class="skill-badge">${badge}</span>`:''}</div></div></td><td><div class="support-chips">${g.supports.length?g.supports.map(en=>`<span class="chip">${gameImage(en,'support-art')}<span class="chip-text">${term(en)}<small>${esc(en)}</small></span></span>`).join(''):`<span class="fineprint">${label('noSupports')}</span>`}</div></td></tr>`
 }).join('')}</tbody></table><p class="fineprint">${label('precisionNote')}</p><a class="planner-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} · ${label('treeLink')}</a><a class="planner-link" href="#passive-tree">${label('treeTitle')} ↓</a>`;
}
function renderChecks(){ $('swap-checklist').innerHTML=c().swapItems.map(([id,title,desc])=>`<label class="check-item"><input type="checkbox" data-check="${id}" ${checks[id]?'checked':''}><span><strong>${esc(title)}</strong><p>${rich(desc)}</p></span></label>`).join(''); updateCheckCount();}
function updateCheckCount(){$('swap-count').textContent=label('checked')+' '+c().swapItems.filter(([id])=>checks[id]).length+' / '+c().swapItems.length;}
function renderQuests(){const groups=[...new Set(c().quests.map(q=>q[0]))];$('quest-groups').innerHTML=groups.map(group=>`<article class="quest-group"><h3>${esc(group)}</h3><table class="quest-table"><thead><tr><th></th><th>${label('questWhere')}</th><th>${label('questReward')}</th></tr></thead><tbody>${c().quests.map((q,i)=>q[0]===group?`<tr><td><input class="quest-check" type="checkbox" data-quest="${i}" ${questChecks[i]?'checked':''} aria-label="${esc(label('questDone')+' '+q[1])}"></td><td>${esc(q[1])}</td><td>${esc(q[2])}</td></tr>`:'').join('')}</tbody></table></article>`).join('');}
function renderQuality(){$('quality-inputs').innerHTML=c().qualitySources.map(([name,initial,max],i)=>`<label class="quality-input-row" for="quality-${i}"><span class="quality-source-name">${gameImage(['Flameblast','Fox Idol','Paragon','Gold Amulet','Advanced Thaumaturgy'][i])}${esc(name)}</span><span><input type="number" id="quality-${i}" data-quality="${i}" min="0" max="${max}" step="1" value="${Number.isFinite(Number(qualityValues[i]))?Math.max(0,Math.min(max,Number(qualityValues[i]))):initial}"> %</span></label>`).join('');updateQuality();}
function updateQuality(){const inputs=[...document.querySelectorAll('[data-quality]')];const total=inputs.reduce((a,input)=>a+Number(input.value||0),0);$('quality-value').textContent=total;$('quality-state').textContent=total>=40?label('thresholdReached'):label('thresholdMissing')+' '+(40-total)+' '+label('qualityPoints');$('quality-state').classList.toggle('missing',total<40);$('quality-bar-fill').style.width=Math.min(100,total/50*100)+'%';}
function renderTerms(){const input=$('term-search').value.trim().toLowerCase();const list=Object.values(TERMS).filter(t=>[t.cn,t.tw,t.en].some(s=>s.toLowerCase().includes(input)));$('glossary-wrap').innerHTML=list.length?`<table class="glossary-table"><thead><tr><th>${label('termChinese')}</th><th>${label('termEnglish')}</th></tr></thead><tbody>${list.map(t=>`<tr><td>${term(t.en,true)}</td><td>${esc(t.en)}</td></tr>`).join('')}</tbody></table>`:`<div class="no-results">${label('termNoResults')}</div>`;$('term-count').textContent=list.length+' '+label('allTerms');}
function render(){hideTip();document.documentElement.lang=language==='tw'?'zh-Hant':'zh-Hans';document.title=c().title+' | Fubgun '+label('manual');document.querySelectorAll('[data-label]').forEach(e=>e.textContent=label(e.dataset.label));$('lang-cn').setAttribute('aria-pressed',language==='cn');$('lang-tw').setAttribute('aria-pressed',language==='tw');document.querySelector('.lang-switch').setAttribute('aria-label',label('language'));$('navigation').innerHTML=c().nav.map(([id,name])=>`<a href="#${id}" data-nav="${id}">${esc(name)}</a>`).join('');$('navigation').setAttribute('aria-label',label('chapter'));$('stage-tabs').setAttribute('aria-label',label('stages'));$('class-name').textContent=termName('Gemling Legionnaire');$('class-art').innerHTML=gameImage('Gemling Legionnaire','class-icon');$('hero-game-strip').innerHTML=['Flameblast','Oil Grenade','Cast on Dodge'].map(en=>`<span>${gameImage(en)}${term(en)}</span>`).join('');$('title-flame').textContent=termName('Flameblast');$('title-oil').textContent=termName('Oil Grenade');$('hero-subtitle').textContent=c().subtitle;$('hero-desc').textContent=c().intro;$('overview-grid').innerHTML=c().overview.map(prose).join('');$('flow-flame').innerHTML=gameImage('Flameblast','flow-icon')+term('Flameblast');$('flow-oil').innerHTML=gameImage('Oil Grenade','flow-icon')+term('Oil Grenade');$('flow-dodge').innerHTML=gameImage('Cast on Dodge','flow-icon')+term('Cast on Dodge');$('mechanism-detail').innerHTML=c().mechanics.map(prose).join('');renderStage();renderChecks();$('swap-note').textContent=c().swapNote;
 const icons=['staff','Morior Invictus','Blackflame','Surefooted Sigil','Decree of Flight','Dousing Charm','jewels'];$('gear-list').innerHTML=c().gear.map((row,i)=>`<article class="gear-row"><span class="gear-icon">${ASSETS.names[icons[i]]?gameImage(icons[i]):categoryImage(icons[i])}</span><div><h3>${esc(row[1])}</h3><p>${rich(row[2])}</p></div></article>`).join('');$('ascension').innerHTML=c().ascendancy.map(([en,desc],i)=>`<article class="asc-node"><span class="asc-number">${i+1}</span>${gameImage(en,'asc-art')}${term(en)}<small>${esc(en)}</small><p>${esc(desc)}</p></article>`).join('');$('tree-notes').innerHTML=c().treeNotes.map(text=>`<li>${esc(text)}</li>`).join('');renderQuality();$('quality-notes').innerHTML=c().qualityNotes.map(p=>`<p>${esc(p)}</p>`).join('');$('faq-list').innerHTML=c().faq.map(([question,answer],i)=>`<details ${i===0?'open':''}><summary>${esc(question)}</summary><p>${esc(answer)}</p></details>`).join('');renderQuests();$('term-search').placeholder=label('searchPlaceholder');$('term-search').setAttribute('aria-label',label('searchLabel'));renderTerms();$('pob-code').value=POB;$('vendor-regex').value=VENDOR_REGEX;updateProgress();}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2400)}
async function copy(text,textarea){try{await navigator.clipboard.writeText(text);toast(label('copied'));}catch{$(textarea).focus();$(textarea).select();let ok=false;try{ok=document.execCommand('copy')}catch{}toast(ok?label('copied'):label('copyFailed'));}}
function setLanguage(lang){const anchor=[...document.querySelectorAll('main section,main .hero')].reverse().find(e=>e.getBoundingClientRect().top<=140);const top=anchor?.getBoundingClientRect().top;language=lang;save('language',lang);render();if(anchor&&top!==undefined){window.scrollBy(0,anchor.getBoundingClientRect().top-top)}}
$('lang-cn').addEventListener('click',()=>setLanguage('cn'));$('lang-tw').addEventListener('click',()=>setLanguage('tw'));
$('stage-tabs').addEventListener('click',e=>{const button=e.target.closest('[data-stage]');if(!button)return;currentStage=Number(button.dataset.stage);save('stage',currentStage);renderStage();$('stage-tab-'+currentStage).focus({preventScroll:true});});
$('stage-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();currentStage=e.key==='Home'?0:e.key==='End'?8:(currentStage+(e.key==='ArrowRight'?1:8))%9;save('stage',currentStage);renderStage();$('stage-tab-'+currentStage).focus({preventScroll:true});});
$('swap-checklist').addEventListener('change',e=>{if(!e.target.dataset.check)return;checks[e.target.dataset.check]=e.target.checked;save('checks',checks);updateCheckCount();});$('reset-checks').addEventListener('click',()=>{checks={};save('checks',checks);renderChecks();});
$('quest-groups').addEventListener('change',e=>{if(e.target.dataset.quest===undefined)return;questChecks[e.target.dataset.quest]=e.target.checked;save('quests',questChecks);});
$('quality-inputs').addEventListener('input',e=>{if(e.target.dataset.quality===undefined)return;let value=Number(e.target.value);if(!Number.isFinite(value))value=0;value=Math.max(0,Math.min(Number(e.target.max),Math.round(value)));if(e.target.value!=='')e.target.value=value;qualityValues[Number(e.target.dataset.quality)]=value;save('quality',qualityValues);updateQuality();});
$('term-search').addEventListener('input',renderTerms);$('copy-pob').addEventListener('click',()=>copy(POB,'pob-code'));$('copy-regex').addEventListener('click',()=>copy(VENDOR_REGEX,'vendor-regex'));downloadUrl=URL.createObjectURL(new Blob([POB],{type:'text/plain;charset=utf-8'}));$('download-pob').href=downloadUrl;
$('print').addEventListener('click',()=>window.print());let printDetails=[];window.addEventListener('beforeprint',()=>{hideTip();printDetails=[...document.querySelectorAll('#faq-list details')].filter(d=>!d.open);printDetails.forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>printDetails.forEach(d=>d.open=false));
function updateProgress(){const range=document.documentElement.scrollHeight-window.innerHeight;const progress=range>0?Math.max(0,Math.min(100,Math.round(window.scrollY/range*100))):100;$('progress-fill').style.width=progress+'%';$('read-percent').textContent=progress+'%';let active='overview';for(const [id] of c().nav){const element=$(id);if(element&&element.getBoundingClientRect().top<=165)active=id;}document.querySelectorAll('[data-nav]').forEach(a=>{const selected=a.dataset.nav===active;a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}
let scrollTick=false;window.addEventListener('scroll',()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{updateProgress();scrollTick=false})},{passive:true});window.addEventListener('resize',updateProgress);
let importedFont;
$('font-import').addEventListener('click',()=>$('local-font').click());
$('local-font').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const face=new FontFace('Guide IPA Font',await file.arrayBuffer());await face.load();if(importedFont)document.fonts.delete(importedFont);importedFont=face;document.fonts.add(face);for(const key of ['--serif','--sans'])document.documentElement.style.setProperty(key,'"Guide IPA Font",sans-serif');$('font-status').textContent=label('fontApplied')+' '+file.name;}catch{$('font-status').textContent=label('fontError');}});
$('font-reset').addEventListener('click',()=>{for(const key of ['--serif','--sans'])document.documentElement.style.removeProperty(key);if(importedFont){document.fonts.delete(importedFont);importedFont=null;}$('local-font').value='';$('font-status').textContent=label('fontDefault');});

__PASSIVE_SCRIPT__
render();
</script>
