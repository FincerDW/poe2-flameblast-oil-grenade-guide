name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependency
        run: python -m pip install -r requirements.txt
      - name: Build standalone HTML
        run: python build.py --output _site/index.html
      - name: Check generated JavaScript and embedded resources
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          page = Path('_site/index.html').read_text(encoding='utf-8')
          assert not re.search(r'__(?:TOOLTIP|GUIDE|ASSETS|TERMS)[A-Z_]*__', page)
          assert 'const TOOLTIPS=' in page
          assert 'data:font/woff2;base64,' in page
          Path('/tmp/guide.js').write_text(re.search(r'<script>(.*?)</script>', page, re.S)[1], encoding='utf-8')
          PY
          node --check /tmp/guide.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
